<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 房间改造工具</title>
  <link rel="icon" type="image/svg+xml" href="/home-design-lite/favicon.svg" />
  <script type="module" crossorigin src="/home-design-lite/assets/index-Bun_OIkY.js"></script>
  <link rel="stylesheet" crossorigin href="/home-design-lite/assets/index-Ka2cHUn7.css">
</head>
<body>
  <div id="app">
    <div class="app-container">
      <!-- 标题栏 -->
      <div class="title-bar">
        🏠 房间改造工具
        <div class="tab-header" id="tab-header">
          <button class="tab-btn active" data-tab="room">🏠 房间设置</button>
          <button class="tab-btn" data-tab="furniture">🪑 选择家具</button>
          <button class="tab-btn" data-tab="layout">✨ 布局方案</button>
          <button class="tab-btn" data-tab="adjust">✋ 微调</button>
        </div>
        <div class="header-actions">
          <button class="action-btn-sm" id="btn-export" style="margin-right:4px;">导出</button>
        </div>
      </div>

      <!-- 主体 -->
      <div class="main-layout">
        <!-- 左侧面板 -->
        <div class="sidebar" id="sidebar">
          <!-- 面板内容由各模块动态填充 -->
          <div class="panel-content" id="panel-room"></div>
          <div class="panel-content" id="panel-furniture" style="display:none;"></div>
          <div class="panel-content" id="panel-layout" style="display:none;"></div>
          <div class="panel-content" id="panel-adjust" style="display:none;"></div>

          <!-- 无房间引导 -->
          <div class="panel-content" id="panel-no-room" style="display:none;">
            <div class="no-room-hint">🏠 请先创建房间</div>
          </div>

          <!-- 门/窗参数面板 (选中时叠加显示) -->
          <div class="panel-param" id="door-panel" style="display:none;">
            <div class="panel-section-title">门参数</div>
            <div style="font-size:11px; color:#7f8c8d; margin-bottom:2px;">宽度 (cm)</div>
            <input type="number" id="door-width-input" min="40" max="200" step="5" value="80"
              style="width:100%; padding:4px; border:1px solid #d5d0ca; border-radius:4px; font-size:12px; margin-bottom:6px;">
            <div style="display:flex; gap:4px;">
              <button class="action-btn" id="btn-door-hinge" style="flex:1; font-size:11px; padding:4px;">铰链: 左</button>
              <button class="action-btn" id="btn-door-dir" style="flex:1; font-size:11px; padding:4px;">向内开</button>
            </div>
          </div>
          <div class="panel-param" id="window-panel" style="display:none;">
            <div class="panel-section-title">窗户参数</div>
            <div style="font-size:11px; color:#7f8c8d; margin-bottom:2px;">宽度 (cm)</div>
            <input type="number" id="window-width-input" min="40" max="200" step="5" value="100"
              style="width:100%; padding:4px; border:1px solid #d5d0ca; border-radius:4px; font-size:12px;">
          </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-wrapper">
          <div class="canvas-container" id="canvas-container">
            <div id="canvas-stage"></div>

            <!-- 首次打开模板卡片覆盖层 -->
            <div class="template-overlay" id="template-overlay">
              <div class="template-cards">
                <div class="template-card" data-template="children">
                  <span class="template-emoji">👶</span>
                  <span class="template-name">儿童房</span>
                  <span class="template-size">4×3m</span>
                </div>
                <div class="template-card" data-template="bedroom">
                  <span class="template-emoji">🛏️</span>
                  <span class="template-name">主卧</span>
                  <span class="template-size">5×4m</span>
                </div>
                <div class="template-card" data-template="study">
                  <span class="template-emoji">📚</span>
                  <span class="template-name">书房</span>
                  <span class="template-size">3×3m</span>
                </div>
                <div class="template-card" data-template="living">
                  <span class="template-emoji">🛋️</span>
                  <span class="template-name">客厅</span>
                  <span class="template-size">6×4m</span>
                </div>
              </div>
              <div class="template-or-custom">或自定义尺寸</div>
            </div>
          </div>

          <!-- 画布右下角缩放控件 -->
          <div class="canvas-zoom-controls" id="canvas-zoom-controls">
            <button class="zoom-btn" id="btn-fit-canvas" title="铺满画布 (Ctrl+0)">⊞ 铺满画布</button>
            <span class="zoom-label" id="zoom-label" title="双击重置到100%">100%</span>
          </div>
        </div>
      </div>

      <!-- 状态栏 -->
      <div class="status-bar" id="status-bar">
        <span class="status-dot idle" id="status-dot"></span>
        <span id="status-text">选择一个模板开始，或自定义房间尺寸</span>
        <span class="shortcut-hint" id="shortcut-hint">[快捷键?]</span>
      </div>
    </div>
  </div>

  <!-- 右键菜单浮层 -->
  <div class="context-menu" id="context-menu" style="display:none;">
    <div class="context-menu-item" data-action="rotate">旋转 90°</div>
    <div class="context-menu-item" data-action="edit-size">编辑尺寸...</div>
    <div class="context-menu-item" data-action="delete">删除</div>
  </div>

  <!-- 导出弹窗 -->
  <div class="modal-overlay" id="modal-export" style="display:none;">
    <div class="modal-box">
      <h3>导出方案</h3>
      <div class="modal-preview" id="export-preview"></div>
      <div class="modal-options">
        <label><input type="checkbox" checked> 房间</label>
        <label><input type="checkbox" checked> 家具</label>
        <label><input type="checkbox" checked> 标注</label>
      </div>
      <div class="modal-actions">
        <button class="action-btn primary" id="btn-export-png">导出 PNG</button>
        <button class="action-btn" id="btn-export-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 快捷键提示弹窗 -->
  <div class="modal-overlay" id="modal-shortcuts" style="display:none;">
    <div class="modal-box">
      <h3>快捷键</h3>
      <div class="shortcut-list">
        <div class="shortcut-row"><kbd>Ctrl+0</kbd> <span>铺满画布</span></div>
        <div class="shortcut-row"><kbd>Ctrl+Z</kbd> <span>撤销</span></div>
        <div class="shortcut-row"><kbd>Ctrl+Y</kbd> <span>重做</span></div>
        <div class="shortcut-row"><kbd>Delete</kbd> <span>删除选中</span></div>
        <div class="shortcut-row"><kbd>Esc</kbd> <span>取消选中/退出放置</span></div>
        <div class="shortcut-row"><kbd>← →</kbd> <span>切换布局方案</span></div>
        <div class="shortcut-row"><kbd>空格+拖拽</kbd> <span>平移画布</span></div>
        <div class="shortcut-row"><kbd>滚轮</kbd> <span>缩放画布</span></div>
      </div>
      <button class="action-btn" id="btn-shortcuts-close">关闭</button>
    </div>
  </div>

  <!-- 添加家具选择弹窗 -->
  <div class="modal-overlay" id="modal-furniture-picker" style="display:none;">
    <div class="modal-box" style="min-width:280px;">
      <h3>选择要添加的家具</h3>
      <div class="furniture-picker-grid" id="furniture-picker-grid"></div>
      <div class="modal-actions" style="margin-top:12px;">
        <button class="action-btn" id="btn-picker-cancel">取消</button>
      </div>
    </div>
  </div>

</body>
</html>
